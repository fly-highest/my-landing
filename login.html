<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - GOODS SHOP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="box narrow">
      <div class="tabs">
        <button id="tab-login">로그인</button>
        <button id="tab-signup" class="secondary">회원가입</button>
      </div>
      <form id="form">
        <input id="email" type="email" placeholder="이메일" required autocomplete="email">
        <input id="password" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password">
        <button id="submit" type="submit">로그인</button>
      </form>
      <p id="message" class="message"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
