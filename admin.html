<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - GOODS SHOP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>전체 결제 내역 (관리자)</h1>
    <div class="summary">
      <div class="box"><div>결제완료 건수</div><div id="paid-count" class="num">-</div></div>
      <div class="box"><div>총 매출</div><div id="total" class="num">-</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>주문일시</th><th>회원</th><th>상품</th><th>금액</th><th>상태</th><th>주문번호</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
